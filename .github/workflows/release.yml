name: Release

on:
  push:
    branches: ["main"]
    paths: ["package.json"]

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version field changed
        id: check
        run: |
          PREV=$(git show HEAD^:package.json | jq -r '.version')
          CURR=$(jq -r '.version' package.json)
          echo "Previous version: $PREV, new version: $CURR"
          if [ "$PREV" != "$CURR" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURR" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the git tag
      id-token: write # enables OIDC Trusted Publishing — no NPM_TOKEN required
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (Trusted Publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pymupdf4llm (for parity tests)
        run: pip install -r requirements.txt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Prettier + ESLint + tsc)
        run: bun run lint:check

      - name: Run parity tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --provenance --access public
